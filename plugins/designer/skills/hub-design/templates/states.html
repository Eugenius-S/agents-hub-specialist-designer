<!doctype html>
<!-- Template: a state map (Pure UI, references/pure-ui.md). The component is a function view(p) that returns an HTML string.
     STATES is a list of inputs: each is drawn as an artboard with a caption. A new state is a line in STATES, not a new file.
     ?state=<id> shows one state full screen. "Chaos" randomly breaks the parameters: whatever fell apart, add to STATES. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>States 1, video player</title>
<style>
  :root { --bg: #f4f4f6; --ink: #1b1b1f; --mute: #6b6b75; --line: #dcdce2; }
  body { margin: 0; padding: 40px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 16px; align-items: baseline; margin-bottom: 32px; }
  header h1 { margin: 0; font-size: 20px; }
  header .count { color: var(--mute); }
  header button { margin-left: auto; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  .group { margin-bottom: 40px; }
  .group h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .board { display: flex; flex-direction: column; gap: 8px; }
  .board .label { font-size: 12px; color: var(--mute); }
  .board .label b { color: var(--ink); font-weight: 600; }
  .frame { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .board.chaos .frame { outline: 2px dashed #d33; outline-offset: 4px; }
  body.single { padding: 0; } body.single header, body.single .label { display: none; }
  body.single .frame { border: 0; border-radius: 0; }
  /* ↓ component styles */
  .player { position: relative; aspect-ratio: 16 / 9; background: #111; color: #fff; display: grid; place-items: center; }
  .player .title { position: absolute; inset: 12px 16px auto; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .bar { position: absolute; inset: auto 16px 14px; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .3); box-shadow: 0 0 6px rgb(0 0 0 / .5); }
  .player .bar i { display: block; height: 100%; border-radius: inherit; background: #fff; }
</style>
</head>
<body>
<header><h1 id="sheet-title"></h1><span class="count" id="count"></span><button id="chaos" type="button">Chaos</button></header>
<main id="sheet"></main>
<script>
// Component: the same parameters, the same look. Markup only, no side effects.
function view(p) {
  if (p.error) return `<div class="player" role="alert">${p.error}</div>`;
  if (!p.src) return `<div class="player">${p.loading ? 'Loading…' : 'No video yet'}</div>`;
  return `<div class="player"><div class="title">${p.title}</div>
    <div class="bar"><i style="width:${Math.round(Math.min(1, Math.max(0, p.progress || 0)) * 100)}%"></i></div></div>`;
}
const TITLE = 'Video player';
// Artboard input: id, group, caption, frame width, parameters. Data is real from the task or [in brackets].
const STATES = [
  { id: 'empty',   group: 'Basic', title: 'No video',         width: 480, params: {} },
  { id: 'loading', group: 'Basic', title: 'Loading',          width: 480, params: { loading: true } },
  { id: 'error',   group: 'Basic', title: 'Network error',    width: 480, params: { error: 'Failed to load the video' } },
  { id: 'ready',   group: 'Basic', title: 'Playing, 40%',     width: 480, params: { src: 'assets/clip.mp4', title: '[Clip title]', progress: .4 } },
  { id: 'long',    group: 'Edges', title: 'Long title',       width: 480, params: { src: 'assets/clip.mp4', title: '[A very long clip title that does not fit on one line of the player]', progress: .1 } },
  { id: 'narrow',  group: 'Edges', title: 'Width 320',        width: 320, params: { src: 'assets/clip.mp4', title: '[Clip title]', progress: 1 } },
];

const LONG = s => (s + ' ').repeat(4).trim();
function chaos(p) {  // breaks the parameters: long strings, empty fields, extreme numbers
  const q = {};
  for (const [k, v] of Object.entries(p)) {
    const r = Math.random();
    if (/^(src|href|url)$/.test(k)) { q[k] = v; continue; }  // we do not break paths
    q[k] = typeof v === 'string' ? (r < .5 ? LONG(v) : r < .7 ? '' : v)
         : typeof v === 'number' ? [0, 1, v * 1000, -1][Math.floor(r * 4)] : v;
  }
  return q;
}
function render(useChaos) {
  const one = new URLSearchParams(location.search).get('state');
  const list = one ? STATES.filter(s => s.id === one) : STATES;
  document.body.classList.toggle('single', !!one);
  document.title = document.title || TITLE;
  document.getElementById('sheet-title').textContent = TITLE;
  document.getElementById('count').textContent = `states ${STATES.length}`;
  const groups = [...new Set(list.map(s => s.group))];
  document.getElementById('sheet').innerHTML = groups.map(g => `<section class="group"><h2>${g}</h2><div class="row">` +
    list.filter(s => s.group === g).map((s, i) => {
      const width = useChaos ? 320 + Math.round(Math.random() * 1280) : s.width;
      const params = useChaos ? chaos(s.params) : s.params;
      const label = `${String(STATES.indexOf(s) + 1).padStart(2, '0')} ${s.title}`;
      return `<div class="board${useChaos ? ' chaos' : ''}" id="state-${s.id}" data-screen-label="${label}">
        <div class="label"><b>${label}</b> · ${width}px · <code>${JSON.stringify(params)}</code></div>
        <div class="frame" style="width:${one ? '100vw' : width + 'px'}">${view(params)}</div></div>`;
    }).join('') + '</div></section>').join('');
}
document.getElementById('chaos').onclick = () => render(true);
render(false);
</script>
</body>
</html>
